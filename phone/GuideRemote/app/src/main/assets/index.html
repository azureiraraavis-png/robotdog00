<!doctype html><html lang=ko><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>안내 리모컨 — 통로 확인</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:18px calc(16px + env(safe-area-inset-left)) 24px;
     background:#14181d;color:#e8edf1;line-height:1.6;
     font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
h1{font-size:18px;margin:0 0 4px}
.ver{font-size:11px;font-weight:400;color:#14181d;background:#7fe0b0;
     border-radius:6px;padding:2px 7px;vertical-align:middle;margin-left:6px}
p.sub{color:#8d979f;font-size:13px;margin:0 0 18px}
.row{display:flex;gap:10px;align-items:flex-start;background:#1d232a;
     border:1px solid #2c343d;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.mark{flex:none;width:22px;font-size:16px;text-align:center}
.what{font-weight:600;font-size:15px}
.why{color:#8d979f;font-size:12.5px;margin-top:2px;word-break:break-all}
.ok .mark{color:#7fe0b0}.no .mark{color:#ff9c8f}
h2{font-size:12px;letter-spacing:.12em;color:#8d979f;text-transform:uppercase;
   margin:22px 4px 10px}
#verdict{margin-top:20px;padding:16px;border-radius:12px;font-size:15px;
         background:#1d232a;border:1px solid #2c343d}
#verdict.good{background:#215843;border-color:#2f7d5f}
#verdict.bad{background:#5b241d;border-color:#8f2f26}
b{color:#fff}
label{display:block;color:#8d979f;font-size:12px;margin:12px 2px 4px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #2c343d;
      background:#11151a;color:#e8edf1;font-size:15px;font-family:inherit}
button{width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;
       background:#2f6d8f;color:#fff;font-size:15px;font-weight:600;
       font-family:inherit}
button:disabled{background:#2c343d;color:#6d767e}
pre{white-space:pre-wrap;word-break:break-all;background:#11151a;
    border:1px solid #2c343d;border-radius:10px;padding:12px;
    font-size:11.5px;line-height:1.5;color:#a8b3bb;margin:10px 0 0;
    max-height:220px;overflow:auto}
.tick{display:flex;align-items:center;gap:9px;color:#e8edf1;font-size:14px;
      margin:14px 2px 0}
.tick input{width:20px;height:20px;accent-color:#2f6d8f}
#bridge{margin-top:12px;padding:14px;border-radius:12px;
        background:#1d232a;border:1px solid #2c343d;font-size:14px}
#bridge.good{background:#215843;border-color:#2f7d5f}
#bridge.bad{background:#5b241d;border-color:#8f2f26}
</style></head><body>

<h1>통로가 뚫렸는가 <span class=ver>6판 · 제안 갖추기</span></h1>
<p class=sub>앱이 빌드되고, 폰에 깔리고, 화면이 뜨고, 화면이 앱과 말할 수
있는지 — 그것만 봅니다. 로봇은 아직 아무 상관 없습니다.
<b>아래로 내리면 '시그널링 다리' 칸이 있습니다.</b></p>

<!-- ★ 제목 옆의 판수 딱지는 장식이 아닙니다 ★
     페이지를 고쳐 넣었는데 화면이 그대로일 때, '안 들어간 것' 과 '내가
     안 내려본 것' 이 똑같이 보입니다. 실제로 한 번 그랬습니다.
     이 딱지가 있으면 맨 위 한 줄로 구별됩니다 — 딱지가 없으면 옛 페이지,
     있으면 새 페이지인데 안 내려본 것. 고칠 때마다 판수를 올립니다. -->

<h2>확인</h2>
<div id=list></div>
<div id=verdict>재는 중…</div>

<script>
const list = document.getElementById('list');
const rows = [];

function row(what, ok, why){
  rows.push(ok);
  const d = document.createElement('div');
  d.className = 'row ' + (ok ? 'ok' : 'no');
  d.innerHTML = '<div class=mark>' + (ok ? '○' : '★') + '</div>'
              + '<div><div class=what>' + what + '</div>'
              + '<div class=why>' + why + '</div></div>';
  list.appendChild(d);
}

/* 1. 화면이 살아 있는가 — 이 글이 보이면 자바스크립트가 돕니다 */
row('화면이 돕니다', true, '이 목록이 보이면 자바스크립트가 살아 있습니다');

/* 2. 출처가 있는가
      file:// 로 열렸으면 origin 이 "null" 입니다. 그러면 아래 것들이
      줄줄이 막힙니다 — 그래서 가짜 https 주소로 띄웁니다.

      ※ 'https 인가' 를 보면 안 됩니다. 필요한 것은 출처가 **있는가**
        이지 무슨 방식인가가 아닙니다. 처음에 https 로 검사했다가
        PC 브라우저(http)에서 멀쩡한 것이 ★ 로 나왔습니다.

      ※ 그런데 file:// 은 따로 걸러야 합니다. PC 크로미움은 file:// 을
        출처로 쳐주고 저장소도 열어주는데, **안드로이드 WebView 는
        그러지 않습니다.** 시험하는 곳이 목표한 곳보다 관대하면
        시험이 거짓말을 합니다. */
row('출처가 있습니다',
    !!location.origin && location.origin !== 'null'
      && !location.origin.startsWith('file:'),
    (location.origin || '(없음)')
      + '  ← null 이나 file:// 이면 저장소와 fetch 가 막힙니다');

/* 3. 저장소 — 화면이 기억하는 것들(마지막 코스 같은)에 씁니다 */
let store = false, storeWhy = '';
try{
  localStorage.setItem('시험', '1');
  store = localStorage.getItem('시험') === '1';
  localStorage.removeItem('시험');
  storeWhy = 'localStorage 읽고 쓰기 됩니다';
}catch(e){ storeWhy = String(e); }
row('저장소를 씁니다', store, storeWhy);

/* 4. WebRTC — 로봇과 실제로 이야기할 통로입니다.
      이게 없으면 폰 단독 계획이 통째로 무너집니다. */
const rtc = typeof RTCPeerConnection === 'function';
let rtcWhy = rtc ? '' : 'RTCPeerConnection 이 없습니다';
if(rtc){
  try{
    const pc = new RTCPeerConnection();
    const ch = pc.createDataChannel('시험');
    rtcWhy = '연결 객체와 데이터채널을 만들 수 있습니다 (' + ch.label + ')';
    pc.close();
  }catch(e){ rtcWhy = String(e); }
}
row('WebRTC 가 있습니다', rtc, rtcWhy);

/* 5. 앱과 말이 통하는가 — 시그널링 다리가 지나갈 길입니다 */
let bridge = false, bridgeWhy = '앱이 안 붙어 있습니다 (브라우저로 열었나요?)';
try{
  if(typeof app !== 'undefined'){
    bridge = true;
    bridgeWhy = app.device() + ' · 안드로이드 ' + app.androidVersion()
              + ' · 앱 ' + app.appVersion();
  }
}catch(e){ bridgeWhy = String(e); }
row('앱과 말이 통합니다', bridge, bridgeWhy);

/* 6. 화면 크기 — 조종판이 손가락에 맞는지 나중에 볼 때 씁니다 */
row('화면', true,
    innerWidth + ' × ' + innerHeight + ' · 배율 ' + devicePixelRatio);

/* ── 판정 ── */
const bad = rows.filter(x => !x).length;
const v = document.getElementById('verdict');
if(bad === 0){
  v.className = 'good';
  v.innerHTML = '<b>통로가 뚫렸습니다.</b><br>'
    + '빌드 → 설치 → 실행 → 화면 → 앱까지 다 이어졌습니다.<br>'
    + '<b>아래로 내려서 시그널링 다리를 재보세요.</b>';
}else{
  v.className = 'bad';
  v.innerHTML = '<b>' + bad + '가지가 막혔습니다.</b><br>'
    + '위에서 ★ 표시된 줄을 보세요. 그 줄의 회색 글씨가 이유입니다.<br>'
    + 'PC 의 Logcat 에도 같은 내용이 "화면" 태그로 찍힙니다.';
}

console.log('통로 확인: ' + (rows.length - bad) + '/' + rows.length + ' 통과');
</script>

<h2>시그널링 다리</h2>
<p class=sub>브라우저가 막히던 두 번의 HTTP 를 앱이 대신 합니다.
<b>먼저 가짜 로봇으로 재세요</b> — PC 에서
<code>.\run sig_test.py --serve</code> 를 켜고, 거기 찍히는 주소를 넣습니다.
그게 통해야 진짜 로봇 앞에 갈 값어치가 있습니다.</p>

<label>주소 (PC 의 가짜 로봇, 또는 진짜 로봇 IP)</label>
<input id=ip inputmode=decimal placeholder="192.168.0.51">
<label>포트</label>
<input id=port inputmode=numeric placeholder="9991">
<label>AES 키 — data2=3 인 로봇만 필요합니다 (없으면 비워두세요)</label>
<input id=key autocapitalize=off autocorrect=off spellcheck=false
       placeholder="hex 32글자">
<button id=go>악수해 보기</button>
<div id=bridge>아직 안 해봤습니다.</div>
<pre id=detail hidden></pre>

<script src="sig.js"></script>
<script>
/* 마지막에 쓴 값을 기억합니다 — 폰에서 IP 를 매번 치는 건 고역입니다.
   저장소가 막혀 있어도(위 3번이 ★ 여도) 화면은 그대로 돌아야 하므로
   읽기·쓰기를 다 감싸둡니다. */
const F = {ip: document.getElementById('ip'),
           port: document.getElementById('port'),
           key: document.getElementById('key')};
try{
  for(const k in F){ const saved = localStorage.getItem('다리.' + k);
                     if(saved) F[k].value = saved; }
}catch(e){ console.warn('저장소를 못 읽었습니다: ' + e); }
if(!F.port.value) F.port.value = '9991';

const out = document.getElementById('bridge');
const detail = document.getElementById('detail');
const go = document.getElementById('go');

function say(cls, html, more){
  out.className = cls;
  out.innerHTML = html;
  if(more){ detail.textContent = more; detail.hidden = false; }
  else { detail.hidden = true; }
}

go.addEventListener('click', async function(){
  const ip = F.ip.value.trim();
  if(!ip){ say('bad', '<b>주소를 넣어주세요.</b>'); return; }
  try{
    for(const k in F) localStorage.setItem('다리.' + k, F[k].value.trim());
  }catch(e){ /* 저장 못 해도 악수는 됩니다 */ }

  go.disabled = true;
  say('', '제안을 만드는 중…');
  try{
    /* ★ 진짜 제안을 씁니다 ★ 가짜 문자열로는 "다리가 틀렸나 SDP 가
       틀렸나" 를 구별할 수 없습니다. */
    const offer = await makeOffer();
    say('', '악수하는 중… (최대 8초)');
    const answer = await handshake(ip, parseInt(F.port.value, 10) || 9991,
                                   offer, F.key.value.trim());
    say('good',
        '<b>악수가 끝까지 갔습니다.</b><br>'
        + '보낸 제안 ' + offer.length + '글자'
        + ' → 받은 응답 ' + answer.length + '글자.<br>'
        + '브라우저가 막히던 두 번의 HTTP 를 앱이 넘겼습니다.',
        answer);
  }catch(e){
    say('bad', '<b>막혔습니다.</b><br>' + String(e.message || e)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'),
        '어디까지 갔는지는 PC 의 Logcat 에서 "다리" 태그로 보입니다.');
  }finally{
    go.disabled = false;
  }
});
</script>
</body></html>
